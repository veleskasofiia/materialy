# Ověří, že se materiály dají převést na web (soukromé pyladiesprague/public-pages,
# čte se tokenem PUBLIC_PAGES_TOKEN),
# a po pushi do main tam spustí import, který otevře PR s novými stránkami.
name: Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kontrola:
    # PR z forků (např. účastnic) nemají přístup k secretu, bez něj se
    # soukromé public-pages nenaklonuje.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: pyladiesprague/public-pages
          path: .web
          token: ${{ secrets.PUBLIC_PAGES_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Jen náhled: vypíše změněné stránky, nic nezapisuje. Selže na chybě
      # formátu (titulek, číslo úlohy, řešení bez zadání) nebo na konfliktu
      # s redakčními náhradami webu.
      - name: Převod na web
        run: node .web/code/import-materials.mjs --source . --ref HEAD

  web:
    needs: kontrola
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Spustit import na webu
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PAGES_TOKEN }}
        run: gh api repos/pyladiesprague/public-pages/dispatches -f event_type=materialy-push -f "client_payload[sha]=$GITHUB_SHA"
